name: Validate Samurai OpenELA 4.14.357

on:
  workflow_dispatch:
  pull_request:
    branches:
      - los23-test

permissions:
  contents: read

concurrency:
  group: samurai-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kernel build validation
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout pull request source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set timezone
        run: sudo timedatectl set-timezone Asia/Dhaka

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            wget \
            zip \
            zlib1g-dev

      - name: Restore clang cache
        uses: actions/cache@v4
        with:
          path: toolchains/clang-r547379
          key: ${{ runner.os }}-clang-r547379-v2

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-samurai-r547379-${{ hashFiles('arch/arm64/configs/samurai_defconfig', 'arch/arm64/configs/ksunext_v32_legacy.config', 'build_script.sh') }}
          restore-keys: |
            ${{ runner.os }}-samurai-r547379-

      - name: Prepare build environment
        run: |
          sed -i 's/\r$//' build_script.sh
          chmod +x build_script.sh
          chmod +x scripts/kconfig/merge_config.sh
          sed -i 's/^cmd_mkdtimg = python2 /cmd_mkdtimg = python3 /' scripts/Makefile.lib
          sed -i \
            -e "s/array('c', ' ' \* self.__metadata_size)/array('b', b' ' * self.__metadata_size)/" \
            -e 's/xrange(/range(/g' \
            -e 's/dt_entry_buf = ""/dt_entry_buf = b""/' \
            -e 's/self.dt_entries_offset \/ 4/self.dt_entries_offset \/\/ 4/' \
            -e 's/(self.dt_entries_offset - self._DT_TABLE_HEADER_SIZE) \/ 4/(self.dt_entries_offset - self._DT_TABLE_HEADER_SIZE) \/\/ 4/' \
            scripts/dtc/libfdt/mkdtboimg.py
          python3 -m py_compile scripts/dtc/libfdt/mkdtboimg.py

      - name: Build kernel
        id: build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ./build_script.sh

      - name: Verify outputs
        if: success()
        run: |
          test -s "${{ steps.build.outputs.zip_path }}"
          test -s "${{ steps.build.outputs.build_log }}"
          test -s "${{ steps.build.outputs.build_info }}"
          unzip -t "${{ steps.build.outputs.zip_path }}"
          grep -q "Kernel: 4.14.357" "${{ steps.build.outputs.build_info }}"
          grep -q "Integration: built-in legacy" "${{ steps.build.outputs.build_info }}"
          grep -q "KernelSU-Next baseline: pinned v3.2" "${{ steps.build.outputs.build_info }}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samurai-pr-diagnostics-${{ github.run_number }}
          path: |
            build.log
            build-info.txt
            out/.config
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zip_name }}
          path: ${{ steps.build.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14
